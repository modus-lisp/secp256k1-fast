name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    # Run on both architectures so each field-vops-* backend is exercised by the
    # in-tree differential oracle (the suite runs entirely through the limb VOPs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-latest }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Run test suite
        run: ./run-tests.sh
